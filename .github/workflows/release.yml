name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build, package and smoke-test every leg — i.e. they verify that
  # a release *would* work — but never publish (see the `release` job's `if`).
  # This is the only way to exercise the release pipeline before pushing a tag.
  workflow_dispatch:

permissions:
  contents: write

# Two runs for the same tag would race on the same Release object; queue them
# instead of cancelling, because cancelling a half-published release leaves a
# partial asset set behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: sys-mcp

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

          # Cross-compile the Intel binary from the ARM runner. GitHub retired
          # macos-13 (the last Intel macOS image) in 2026; the universal SDK on
          # macos-latest produces x86_64 Mach-O just fine, and the smoke test
          # runs under Rosetta 2 which is pre-installed on the runner image.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxtst-dev \
            libxcb-shm0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # A release that does not start is worse than no release. `--version` is
      # handled by clap before the GUI backend or any transport is touched, so
      # it exits 0 without opening a screen-capture handle or binding a port
      # (verified on the local debug build: prints "sys-mcp 0.1.0", exit 0).
      # Each leg builds for its runner's own architecture, so no emulation is
      # needed — adding a foreign target to the matrix means gating this step.
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} --version

      # pwsh does not fail a step on a native command's non-zero exit code, so
      # the code has to be propagated by hand or the smoke test is decoration.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "./target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist

          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} dist/

          tar -czf \
            ${{ env.BINARY_NAME }}-${{ matrix.name }}.tar.gz \
            -C dist \
            ${{ env.BINARY_NAME }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist

          copy `
            target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe `
            dist/

          Compress-Archive `
            -Path dist/${{ env.BINARY_NAME }}.exe `
            -DestinationPath ${{ env.BINARY_NAME }}-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes only. A `workflow_dispatch` run stops after the build legs:
    # everything is compiled, smoke-tested and checksummed, and nothing is
    # published.
    if: github.event_name == 'push'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The build legs upload one artifact per target, each holding a single
      # archive. GitHub release assets are flat, so flatten them here and fail
      # loudly if flattening loses a file to a name collision — otherwise the
      # release would ship fewer binaries than there were build legs.
      - name: Flatten release assets
        run: |
          mkdir -p dist
          src=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          dst=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          if [ "$src" -ne "$dst" ]; then
            echo "::error::flattened $src assets into $dst files — archive names collide across legs"
            exit 1
          fi
          echo "release assets: $dst"

      # Checksums are published next to the binaries so a downloader can verify
      # what it got. They are a baseline, not trust: an attacker who can replace
      # the assets can replace SHA256SUMS too. Signing (cosign/minisign, or
      # Windows code signing) is the step that actually establishes provenance
      # and needs a key decision from the owner — recorded in issue #44.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          sums=$(wc -l < SHA256SUMS)
          files=$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          if [ "$sums" -ne "$files" ]; then
            echo "::error::SHA256SUMS has $sums lines for $files assets"
            exit 1
          fi
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Basenames, so they match the paths recorded in SHA256SUMS.
          files: dist/*
          generate_release_notes: true
