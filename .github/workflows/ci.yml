name: CI

# Every branch gets a signal, not only main/master — a push to a feature
# branch used to trigger nothing, so nothing on `feat/…` had remote evidence
# and the first CI result arrived at PR time (issue #44).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A push that supersedes an in-flight run makes the older one worthless;
# cancel it instead of paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libxtst-dev libxcb-shm0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: v1

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      # `--all-targets` matters: without it the lint gate skipped tests/ and
      # examples/, so lints in the test suite — the code most often edited —
      # were ungated while every local run was stricter.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

  # Feature legs on one OS. The default set is covered by the job above; this
  # is the combination nobody ever compiled: the slim build, where every
  # `#[cfg(not(feature = …))]` arm is live code, and the opt-in `detection`
  # build, which pulls ~56 extra crates and its own platform arms.
  features:
    name: Features (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: no-default-features
            flags: '--no-default-features'
            # The slim suite is stub-only and fast; run it.
            no_run: ''
          - name: detection
            flags: '--features detection'
            # Runs the tests, not just compiles them. The `every_declared_tool_
            # is_dispatchable` drift guard dispatches `detect_objects` with `{}`;
            # before the inference seam (issue #47) that handler called the
            # module-level detector, downloaded the 12.85 MB YOLOv8n ONNX and
            # loaded it into tract (measured 2.85 s) just to analyze the stub's
            # empty image — so the leg had to run `--no-run`. It now reaches
            # `StubDetection` through `GuiClient::detection()` and needs no model,
            # so the whole `detection` suite executes hermetically.
            no_run: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: sudo apt-get install -y libx11-dev libxtst-dev libxcb-shm0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.leg.name }}

      - name: Check
        run: cargo check --all-targets ${{ matrix.leg.flags }}

      - name: Test
        run: cargo test --all-targets ${{ matrix.leg.flags }} ${{ matrix.leg.no_run }}

  # Supply-chain report. Non-blocking on purpose: the dependency tree has
  # never been audited, so a deny here would fail every run until someone
  # triaged it. Read the annotations, add ignores to deny.toml with a reason,
  # and flip `continue-on-error` away once one leg is clean (issue #44).
  supply-chain:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # Real-OS probes (issue #47). The default `test`/`features` jobs are fully
  # hermetic after the SystemCapability and inference seams — nothing there
  # shells out, reads the event log, builds a live desktop backend or loads an
  # ONNX model. The handful of tests that genuinely need the machine are
  # `#[ignore]`d with a `real_os` marker and run here instead.
  #
  # Manual gate only (`workflow_dispatch`): these read host state a runner does
  # not always expose (an interactive Windows session, journald, the unified
  # log), so scheduling them on every push would make the signal flaky rather
  # than informative. A maintainer triggers a run when the platform probes
  # change; the tests self-skip where the environment cannot provide a desktop,
  # so a green run on a headless runner still means "the probe did not crash".
  real-os:
    name: Real-OS probes (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libxtst-dev libxcb-shm0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: real-os-${{ matrix.os }}

      # `-- --ignored` selects exactly the `#[ignore]`d real-OS probes; the
      # hermetic suite already ran in the `test` job. `-Z`-free and platform
      # neutral so it behaves the same on every leg of the matrix.
      - name: Run ignored real-OS probes
        run: cargo test --all-targets -- --ignored --nocapture
