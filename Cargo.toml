[package]
name = "sys-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for local system automation — screen capture, OCR, input, window management, accessibility, shell/terminal, file system, process/service/network management, MCP Hub, and system monitoring"
license = "MIT"
authors = ["Devstroop"]

[[bin]]
name = "sys-mcp"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
hostname = "0.4"

# GUI automation (submodule)
rustautogui = { path = "rustautogui", default-features = false, features = ["full"] }

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Object detection
tract-onnx = { version = "0.22", optional = true }

# OCR (optional, on by default)
ocrs = { version = "0.10", default-features = false, optional = true }
rten = { version = "0.21", optional = true }
rten-tensor = { version = "0.21", optional = true }
ureq = { version = "3", optional = true }
dirs-next = { version = "2", optional = true }

# Web preview (optional, on by default)
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

# Clipboard (cross-platform)
arboard = { version = "3", optional = true }

# Terminal/PTY
portable-pty = "0.8"

# ANSI escape stripping
strip-ansi-escapes = "0.2"

# Logging
tracing = "0.1"

# Testing
[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

# ── Platform: Windows ──────────────────────────────────────────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
] }

# ── Platform: Linux ────────────────────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
zbus = { version = "5", features = ["blocking-api"] }

# ── Platform: macOS ────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
cocoa = "0.26"
objc = "0.2"

[features]
default = ["ocr", "clipboard", "web-preview", "detection"]
ocr = ["dep:ocrs", "dep:rten", "dep:rten-tensor", "dep:ureq", "dep:dirs-next"]
clipboard = ["dep:arboard"]
web-preview = ["dep:axum", "dep:tower-http"]
detection = ["dep:tract-onnx", "dep:ureq", "dep:dirs-next"]
opencl = ["rustautogui/opencl"]
ml = []
