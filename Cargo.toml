[package]
name = "sys-mcp"
version = "0.1.1"
edition = "2021"
description = "MCP server for local system automation — screen capture, OCR, input, window management, accessibility, shell/terminal, file system, process/service/network management, MCP Hub, and system monitoring"
license = "MIT"
authors = ["Devstroop"]

[[bin]]
name = "sys-mcp"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
hostname = "0.4"

# GUI automation (submodule). The `version` matches the submodule's own
# Cargo.toml (2.5.0); cargo-deny treats a bare `{ path = ... }` dep as a
# wildcard, and pinning here keeps the audit clean and makes a submodule
# bump fail loudly rather than silently (#44).
rustautogui = { path = "rustautogui", version = "2.5.0", default-features = false, features = ["full"] }

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Object detection
tract-onnx = { version = "0.23", optional = true }

# OCR (optional, on by default)
# ocrs 0.13 loads ONNX models (the `.rten` format + its S3 URLs are dead).
# `default-features = false` drops ocrs's default `rten`(.rten_format) feature;
# we explicitly enable `onnx` (= rten/onnx_format) so `Model::load_file` can
# read the `.onnx` weights. rten/rten-tensor are pinned to 0.26 to match the
# version ocrs 0.13 depends on, so the whole tree resolves to a single rten
# and the `rten::Model` we build is the same type `OcrEngineParams` expects.
ocrs = { version = "0.13", default-features = false, features = ["onnx"], optional = true }
rten = { version = "0.26", optional = true }
rten-tensor = { version = "0.26", optional = true }
ureq = { version = "3", optional = true }
dirs-next = { version = "2", optional = true }

# Web preview (optional, on by default)
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

# JEV decision client (optional, on by default)
# rustls so no OpenSSL toolchain is needed on any platform; the default
# public gateway and remote hosted endpoints are https, a self-hosted
# gateway may be plain http.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Clipboard (cross-platform)
arboard = { version = "3", optional = true }

# Terminal/PTY
portable-pty = "0.8"

# ANSI escape stripping
strip-ansi-escapes = "0.2"

# Logging
tracing = "0.1"

# Testing
[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

# ── Platform: Windows ──────────────────────────────────────────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

# ── Platform: Linux ────────────────────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
zbus = { version = "5", features = ["blocking-api"] }

# ── Platform: macOS ────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
cocoa = "0.26"
objc = "0.2"

[lints.rust]
unexpected_cfgs = "allow"

# ── Build profiles ─────────────────────────────────────────────────
# OCR inference (rten tensor math + ocrs layout/recognition) is
# compute-bound. The dev profile compiles dependencies at opt-level 0, which
# makes a full-screen `screen_read` take minutes of wall time — enough to
# exceed an MCP call timeout and wedge the serialized stdio transport behind
# it. Optimizing just the crates on that hot path keeps `cargo build` (debug)
# incremental while making OCR usable; the `sys-mcp` crate itself stays at
# opt-level 0 so debugging symbols/behavior are unchanged.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-model-file]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3

[lints.clippy]
# The `#[async_trait]` macro emits a message-less `#[must_use]` on the methods
# it generates, and those methods return `Result` (already `#[must_use]`).
# Newer clippy (1.99+) reports this as `double_must_use` on every capability
# trait. It is macro-generated, so there is nothing to fix in our own code.
double_must_use = "allow"
# Axum handlers use the idiomatic `Result<impl IntoResponse, Response>`
# signature. `Response` is a large type, which trips `result_large_err`.
result_large_err = "allow"

[features]
# `detection` is intentionally NOT default: it adds a second ONNX runtime
# (`tract-onnx`) alongside the `rten` one OCR already carries, costs +56
# packages alone (second only to `jev` at +59; see README "Build profiles"),
# and downloads a ~12 MB YOLOv8n model on first use.
# Re-enable with `--features detection`.
default = ["ocr", "clipboard", "web-preview", "jev"]
ocr = ["dep:ocrs", "dep:rten", "dep:rten-tensor", "dep:ureq", "dep:dirs-next"]
clipboard = ["dep:arboard"]
web-preview = ["dep:axum", "dep:tower-http"]
detection = ["dep:tract-onnx", "dep:ureq", "dep:dirs-next"]
# JEV (TypeSafe System One) decision tool. In the DEFAULT feature set: the
# public OpenCode gateway (jev-1.13-free, Bearer public) is free and needs no
# setup, so `decision` / `decision_rank` / `decision_stats` / `ui_decide` work
# out of the box. Adds reqwest (rustls-tls). Guardrails and the ui_decide loop
# stay OFF at runtime behind --jev-guardrails / --jev-ui-loop regardless.
# Drop it from a slim build with --no-default-features.
jev = ["dep:reqwest"]
opencl = ["rustautogui/opencl"]
ml = []
